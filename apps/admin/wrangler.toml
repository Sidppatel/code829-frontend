name = "code829-admin"
main = "worker/index.ts"
compatibility_date = "2026-04-17"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# Production-only: custom domain route lives under env.production so a bare
# `wrangler deploy` never accidentally publishes to the prod zone. CI invokes
# `wrangler deploy --env production` explicitly.
[env.production]
name = "code829-admin"

[[env.production.routes]]
pattern = "admin.code829.com"
custom_domain = true
