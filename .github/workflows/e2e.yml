name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly run on main at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# Session 2 decision: run Playwright against an existing staging URL rather than
# bringing up the backend from a submodule. Rationale documented in
# memory/backlog_session_2_coverage.md. Fallback: if E2E_BASE_URL is not set,
# the job is skipped (PR trigger) so we never block PRs on unavailable infra.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require staging URL
        id: gate
        run: |
          if [ -z "${{ secrets.E2E_BASE_URL }}" ]; then
            echo "E2E_BASE_URL secret is not configured; skipping Playwright run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.skip != 'true'

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        if: steps.gate.outputs.skip != 'true'
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        if: steps.gate.outputs.skip != 'true'
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_EVENT_SLUG: ${{ secrets.E2E_EVENT_SLUG }}
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          CI: 'true'

      - name: Upload Playwright report
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
