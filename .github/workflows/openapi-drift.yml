name: OpenAPI Type Drift

# Runs on demand (and weekly) to verify the checked-in generated api.ts matches
# the live backend OpenAPI document. Requires backend to expose /openapi/v1.json
# at OPENAPI_URL (production exposure is BE follow-up — see session 5 memo).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Regenerate types
        env:
          OPENAPI_URL: ${{ secrets.OPENAPI_URL }}
        run: pnpm gen:types

      - name: Fail on drift
        run: git diff --exit-code packages/shared/src/types/generated/api.ts
