name: OpenAPI Type Drift

# Runs on demand (and weekly) to verify the checked-in generated api.ts matches
# the live backend OpenAPI document. Skipped silently when OPENAPI_URL or
# OPENAPI_TOKEN secrets are unset (BE follow-up — see session 5 memo).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - id: gate
        name: Check OPENAPI secrets present
        env:
          OPENAPI_URL: ${{ secrets.OPENAPI_URL }}
          OPENAPI_TOKEN: ${{ secrets.OPENAPI_TOKEN }}
        run: |
          if [ -z "$OPENAPI_URL" ] || [ -z "$OPENAPI_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OPENAPI_URL or OPENAPI_TOKEN secret not set — skipping drift check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch OpenAPI document
        if: steps.gate.outputs.skip != 'true'
        env:
          OPENAPI_URL: ${{ secrets.OPENAPI_URL }}
          OPENAPI_TOKEN: ${{ secrets.OPENAPI_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $OPENAPI_TOKEN" "$OPENAPI_URL" -o /tmp/openapi.json
          # Sanity: file must be JSON with openapi field; fail loud otherwise
          node -e "const d=require('/tmp/openapi.json'); if(!d.openapi){console.error('not an OpenAPI doc');process.exit(1)}"

      - name: Regenerate types
        if: steps.gate.outputs.skip != 'true'
        run: |
          pnpm exec openapi-typescript /tmp/openapi.json \
            -o packages/shared/src/types/generated/api.ts

      - name: Fail on drift
        if: steps.gate.outputs.skip != 'true'
        run: git diff --exit-code packages/shared/src/types/generated/api.ts
