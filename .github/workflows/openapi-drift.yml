name: OpenAPI Type Drift

# Runs on demand (and weekly) to verify the checked-in generated api.ts matches
# the live backend OpenAPI document. Skipped silently when OPENAPI_URL or
# OPENAPI_TOKEN secrets are unset (BE follow-up — see session 5 memo).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - id: gate
        name: Check OPENAPI secrets present
        env:
          OPENAPI_URL: ${{ secrets.OPENAPI_URL }}
          OPENAPI_TOKEN: ${{ secrets.OPENAPI_TOKEN }}
        run: |
          if [ -z "$OPENAPI_URL" ] || [ -z "$OPENAPI_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OPENAPI_URL or OPENAPI_TOKEN secret not set — skipping drift check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate types
        if: steps.gate.outputs.skip != 'true'
        env:
          OPENAPI_URL: ${{ secrets.OPENAPI_URL }}
          OPENAPI_TOKEN: ${{ secrets.OPENAPI_TOKEN }}
        run: |
          pnpm exec openapi-typescript "$OPENAPI_URL" \
            --header "Authorization: Bearer $OPENAPI_TOKEN" \
            -o packages/shared/src/types/generated/api.ts

      - name: Fail on drift
        if: steps.gate.outputs.skip != 'true'
        run: git diff --exit-code packages/shared/src/types/generated/api.ts
